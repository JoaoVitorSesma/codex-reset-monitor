name: Codex Reset Monitor

on:
  schedule:
    - cron: "12,27,42,57 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a Discord test notification"
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

concurrency:
  group: codex-reset-monitor
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.fallback.outputs.should_run }}

    steps:
      - name: Decide whether fallback should run
        id: fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          FALLBACK_RECENT_SECONDS: "600"
        run: |
          set -euo pipefail

          # workflow_dispatch is the primary Cloudflare path (and also supports
          # deliberate manual runs). It should always execute the monitor.
          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Primary/manual dispatch detected; monitor will run."
            exit 0
          fi

          if ! latest="$(
            gh api \
              "repos/$REPOSITORY/actions/workflows/monitor.yml/runs?event=workflow_dispatch&per_page=1" \
              --jq 'if (.workflow_runs | length) > 0 then .workflow_runs[0] | "\(.created_at)|\(.status)|\(.conclusion // "")" else "" end'
          )"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Could not inspect recent workflow_dispatch runs; failing open and running the GitHub fallback."
            exit 0
          fi

          if [[ -z "$latest" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No external dispatch found; GitHub schedule will run as fallback."
            exit 0
          fi

          IFS='|' read -r created_at status conclusion <<< "$latest"
          if ! created_epoch="$(date -d "$created_at" +%s 2>/dev/null)"; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Could not parse the latest dispatch timestamp; failing open and running the GitHub fallback."
            exit 0
          fi

          now_epoch="$(date -u +%s)"
          age_seconds="$(( now_epoch - created_epoch ))"

          if (( age_seconds >= 0 && age_seconds <= FALLBACK_RECENT_SECONDS )); then
            if [[ "$status" != "completed" || "$conclusion" == "success" ]]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Recent healthy workflow_dispatch found (${age_seconds}s old, status=$status, conclusion=${conclusion:-n/a}); skipping duplicate fallback."
              exit 0
            fi

            echo "Recent workflow_dispatch failed (${age_seconds}s old, conclusion=${conclusion:-n/a}); running fallback."
          else
            echo "Latest workflow_dispatch is ${age_seconds}s old; outside fallback window."
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"

  monitor:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_DISCORD: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test && 'true' || 'false' }}
        run: python src/run_monitor.py

      - name: Persist monitor state
        if: github.event_name != 'workflow_dispatch' || inputs.send_test == false
        run: |
          if git diff --quiet -- state/alerts.json; then
            echo "No state changes to persist."
            exit 0
          fi

          git config user.name "codex-reset-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/alerts.json
          git commit -m "chore: update monitor state"

          # main can advance while this run is executing (for example, when a
          # PR is merged). Retry a rejected push by rebasing the state commit
          # onto the latest main instead of turning that harmless race into a
          # failed monitor run.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "State push attempt $attempt was rejected; rebasing onto latest main."
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase monitor state onto latest main."
              exit 1
            fi
          done

          echo "::error::Could not persist monitor state after 3 push attempts."
          exit 1
